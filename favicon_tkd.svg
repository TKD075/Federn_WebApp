<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <mask id="ko">
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="232" fill="white"/>
      <text x="50%" y="54%" fill="black"
            font-family="system-ui, -apple-system, 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
            font-size="240" font-weight="900" text-anchor="middle" dominant-baseline="middle">
        TKD
      </text>
    </mask>
  </defs>
  <!-- The masked rect shows a circular area filled with the gradient, with TKD knocked out -->
  <rect width="512" height="512" fill="url(#rg)" mask="url(#ko)"/>
</svg>