<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Federn - Top</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">Federn</div>
        <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="メニュー">
          Menu
        </button>
        <nav id="primary-nav" class="nav" aria-label="Primary">
          <a href="#projects">プロジェクト</a>
          <a href="#about">自己紹介</a>
          <a href="#" id="login-open" title="ログイン（将来実装）">ログイン</a>
          <a
            href="https://github.com/your-username"
            class="icon-btn"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.57v-2.23c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.35-1.76-1.35-1.76-1.1-.75.08-.73.08-.73 1.22.09 1.86 1.25 1.86 1.25 1.08 1.85 2.84 1.32 3.53 1.01.11-.79.42-1.32.76-1.62-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.16 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.64.24 2.86.12 3.16.77.84 1.24 1.9 1.24 3.22 0 4.62-2.8 5.64-5.48 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .5Z"/>
            </svg>
            <span class="sr-only">GitHub</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main">
      <section class="hero container" aria-labelledby="hero-title">
        <div id="hero-react"></div>
      </section>

      <section id="projects" class="container section" aria-labelledby="projects-title">
        <h2 id="projects-title">最新プロジェクト</h2>
        <p class="lead">GitHub リポジトリ URL 付きで、最新のプロジェクトを表示します。</p>
        <div id="project-list" class="cards" aria-live="polite"></div>
      </section>

      <section id="about" class="container section" aria-labelledby="about-title">
        <h2 id="about-title">自己紹介</h2>
        <div id="about-react"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <section class="footer-brand">
          <div class="brand">Federn</div>
          <p class="muted">お問い合わせは下記フォームまたはSNSから。</p>
          <div class="socials">
            <a href="https://github.com/your-username" target="_blank" rel="noopener noreferrer" class="icon-btn" title="GitHub">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.57v-2.23c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.35-1.76-1.35-1.76-1.1-.75.08-.73.08-.73 1.22.09 1.86 1.25 1.86 1.25 1.08 1.85 2.84 1.32 3.53 1.01.11-.79.42-1.32.76-1.62-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.16 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.64.24 2.86.12 3.16.77.84 1.24 1.9 1.24 3.22 0 4.62-2.8 5.64-5.48 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .5Z"/></svg>
              <span class="sr-only">GitHub</span>
            </a>
            <a href="https://x.com/your-username" target="_blank" rel="noopener noreferrer" class="icon-btn" title="X (Twitter)">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2H21l-6.54 7.476L22.5 22h-6.69l-5.238-6.93L3.5 22H1l7.09-8.103L1.5 2h6.81l4.838 6.292L18.244 2Zm-2.346 18h1.23L7.23 4h-1.2l9.867 16Z"/></svg>
              <span class="sr-only">X</span>
            </a>
            <a href="https://www.linkedin.com/in/your-username" target="_blank" rel="noopener noreferrer" class="icon-btn" title="LinkedIn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8h4V24h-4V8zm7.5 0h3.8v2.2h.05c.53-1 1.83-2.2 3.77-2.2 4.03 0 4.78 2.65 4.78 6.1V24h-4v-7.1c0-1.7-.03-3.9-2.38-3.9-2.38 0-2.74 1.86-2.74 3.8V24h-4V8z"/></svg>
              <span class="sr-only">LinkedIn</span>
            </a>
            <a href="mailto:you@example.com" class="icon-btn" title="Email">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v.01L12 13 22 6.01V6H2Zm20 12V8.24l-9.4 6.58a2 2 0 0 1-2.2 0L1.99 8.24V20H22Z"/></svg>
              <span class="sr-only">Email</span>
            </a>
          </div>
          <small class="muted">© <span id="year"></span> Federn</small>
        </section>

        <section class="footer-contact">
          <h2 class="footer-title">お問い合わせ</h2>
          <form id="contact-form" class="contact-form" novalidate>
            <div class="field">
              <label for="cf-name">お名前</label>
              <input id="cf-name" name="name" type="text" placeholder="山田 太郎" required />
            </div>
            <div class="field">
              <label for="cf-email">メールアドレス</label>
              <input id="cf-email" name="email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="field">
              <label for="cf-message">メッセージ</label>
              <textarea id="cf-message" name="message" rows="4" placeholder="お問い合わせ内容を入力してください" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="cf-submit">送信</button>
            <p id="cf-status" class="muted" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </footer>

    <!-- Auth Modal (Future) -->
    <div class="modal" id="auth-modal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-dialog" role="document" aria-labelledby="auth-title">
        <button class="modal-close" id="auth-close" aria-label="閉じる">×</button>
        <h2 id="auth-title">ログイン（将来実装）</h2>
        <form id="auth-form" class="contact-form" novalidate>
          <div class="field">
            <label for="auth-email">メールアドレス</label>
            <input id="auth-email" name="email" type="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="auth-password">パスワード</label>
            <input id="auth-password" name="password" type="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary" id="auth-submit">ログイン</button>
          <p id="auth-status" class="muted" role="status" aria-live="polite">この機能は未実装です。</p>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script type="module" src="index.js"></script>
    <script type="module" src="profile.react.js"></script>
    <noscript>このサイトを利用するにはJavaScriptを有効にしてください。</noscript>
  </body>
  </html>
