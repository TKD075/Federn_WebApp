<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Federn - Production</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon_tkd.svg" />
  </head>
  <body>
    <header class="site-header" id="site-header"></header>

    <main id="main" class="site-main">
      <section id="projects" class="container section" aria-labelledby="projects-title">
        <h2 id="projects-title">プロジェクト一覧</h2>
        <div id="project-list" class="cards" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <script type="module" src="common/partials.js"></script>
    <script type="module" src="common/common.js"></script>
    <script type="module">
      // inline fetch for projects list
      document.addEventListener('DOMContentLoaded', () => {
        const list = document.getElementById('project-list');
        if (!list) return;
        fetch('/api/projects')
          .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then((items) => {
            if (!Array.isArray(items) || items.length === 0) {
              list.innerHTML = '<p class="lead">まだデータがありません。</p>';
              return;
            }
            list.innerHTML = items.map((p) => {
              const e = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
              const title = e(p.title || 'Untitled');
              const desc = e(p.description || '');
              const url = e(p.url || '#');
              return `
                <article class="card">
                  <h3>${title}</h3>
                  <p>${desc}</p>
                  <p><a href="${url}" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-icon">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.57v-2.23c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.35-1.76-1.35-1.76-1.1-.75.08-.73.08-.73 1.22.09 1.86 1.25 1.86 1.25 1.08 1.85 2.84 1.32 3.53 1.01.11-.79.42-1.32.76-1.62-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.16 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.64.24 2.86.12 3.16.77.84 1.24 1.9 1.24 3.22 0 4.62-2.8 5.64-5.48 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .5Z"/></svg>
                    <span>GitHub リポジトリ</span>
                  </a></p>
                </article>`;
            }).join('');
          })
          .catch((err) => {
            list.innerHTML = `<p class="lead">バックエンドに接続できません: ${String(err).replace(/[&<>"']/g,'')}</p>`;
          });
      });
    </script>
  </body>
  </html>
